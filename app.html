<title>筆順描字本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sycee" viewBox="0 0 24 16">
    <path fill="currentColor" d="M1 7.5c2 1.2 4.2 1.3 6.3.4C8 4.6 9.8 2.6 12 2.6s4 2 4.7 5.3c2.1.9 4.3.8 6.3-.4-.6 4.6-5 7-11 7S1.6 12.1 1 7.5z"></path>
    <path fill="currentColor" opacity="0.55" d="M3.5 10.2c2.4 1.6 5.3 2.3 8.5 2.3s6.1-.7 8.5-2.3c-1.6 2.4-4.7 3.5-8.5 3.5s-6.9-1.1-8.5-3.5z"></path>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path class="i-fill" d="M7 4.5v15l12.5-7.5z"></path></symbol>
  <symbol id="i-step" viewBox="0 0 24 24"><path class="i-fill" d="M5 5v14l10-7z"></path><rect class="i-fill" x="16.5" y="5" width="2.8" height="14" rx="1"></rect></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path class="i-line" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path class="i-line" d="M4.5 3.5v4.2h4.2"></path></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path class="i-line" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle class="i-fill" cx="12" cy="12" r="3.2"></circle></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path class="i-line" d="M20.5 3.5 11.8 12.2"></path><path class="i-fill" d="M11.4 11.6c-2.7-.5-5.2 1.4-5.7 4.2-.3 1.7-1.1 2.7-2.7 3.5 3.7.7 7.3-.3 8.8-3 .9-1.6.9-3.4-.4-4.7z"></path></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path class="i-line" d="M4.5 12h15M13.5 6l6 6-6 6"></path></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect class="i-line" x="3" y="3" width="12" height="12" rx="1.5"></rect><rect class="i-line" x="9" y="9" width="12" height="12" rx="1.5"></rect></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect class="i-line" x="3.5" y="3.5" width="17" height="17" rx="3"></rect><circle class="i-fill" cx="8.5" cy="8.5" r="1.6"></circle><circle class="i-fill" cx="15.5" cy="8.5" r="1.6"></circle><circle class="i-fill" cx="12" cy="12" r="1.6"></circle><circle class="i-fill" cx="8.5" cy="15.5" r="1.6"></circle><circle class="i-fill" cx="15.5" cy="15.5" r="1.6"></circle></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path class="i-line" d="M4 20l1-4.5L16 4.5a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3L8.5 19z"></path><path class="i-line" d="M14 6.5l3.5 3.5"></path></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle class="i-line" cx="12" cy="8.5" r="4"></circle><path class="i-line" d="M4.5 20.5c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"></path></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle class="i-line" cx="12" cy="12" r="3.2"></circle><path class="i-line" d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"></path></symbol>
</svg>

<div class="app" id="app">
  <header class="topbar">
    <div class="title-seal" id="titleSeal" aria-hidden="true"></div>
    <nav class="chips" id="chips" aria-label="這個詞的字"></nav>
    <div class="top-actions">
      <button type="button" class="icon-btn small" id="diceBtn" aria-label="換一個詞" title="換一個詞">
        <svg aria-hidden="true"><use href="#i-dice"></use></svg>
      </button>
      <button type="button" class="icon-btn small" id="customBtn" aria-label="自己出題" title="自己出題">
        <svg aria-hidden="true"><use href="#i-pencil"></use></svg>
      </button>
      <button type="button" class="icon-btn small" id="profileBtn" aria-label="俠客帳號" title="俠客帳號">
        <svg aria-hidden="true"><use href="#i-user"></use></svg>
      </button>
      <button type="button" class="icon-btn small" id="settingsBtn" aria-label="設定" title="設定">
        <svg aria-hidden="true"><use href="#i-gear"></use></svg>
      </button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="arena" id="arena">
      <div class="plaque" id="plaque">第一回合</div>
      <div class="box" id="box">
        <svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line class="guide" x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"></line>
          <line class="guide" x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"></line>
          <line class="guide diag" x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"></line>
          <line class="guide diag" x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"></line>
          <rect class="frame" x="0" y="0" width="100" height="100" vector-effect="non-scaling-stroke"></rect>
        </svg>
        <div id="writer"></div>
        <svg id="mine" aria-hidden="true"></svg>
        <div class="seal" id="seal" hidden><span id="sealText">甲上</span></div>
        <canvas id="fx"></canvas>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="player card">
      <button type="button" class="avatar-tile" id="avatarTile" aria-label="打開兵器譜">
        <canvas id="avatar" width="48" height="36"></canvas>
      </button>
      <div class="player-info">
        <span class="rank-tag" id="rankTag">初入江湖</span>
        <span class="kungfu" id="kungfuTag"></span>
        <div class="purse-row">
          <span class="purse" id="taelsBox"><svg class="sycee silver" aria-hidden="true"><use href="#sycee"></use></svg><b id="taels">0</b> 兩</span>
          <span class="purse" id="ingotsBox"><svg class="sycee gold" aria-hidden="true"><use href="#sycee"></use></svg><b id="ingots">0</b> 元寶</span>
        </div>
        <button type="button" id="armoryBtn">兵器譜</button>
      </div>
    </div>

    <div class="lower">
      <div class="info card" id="info">
        <div class="char-zy">
          <svg class="mini" id="mini" viewBox="0 0 1024 1024" aria-hidden="true"></svg>
          <span class="zy-v" id="zy"></span>
        </div>
        <div class="info-text">
          <div class="meaning" id="meaning"></div>
          <button type="button" class="say" id="sayBtn" aria-label="念出來">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"></path></svg>念
          </button>
          <div class="rad-line" id="radLine"></div>
        </div>
      </div>

      <div class="seg card" id="modes" role="group" aria-label="練習方式">
        <button type="button" data-mode="watch" aria-pressed="true">看筆順<span>觀招</span></button>
        <button type="button" data-mode="trace" aria-pressed="false">描字<span>練招</span></button>
        <button type="button" data-mode="write" aria-pressed="false">自己寫<span>過招</span></button>
      </div>

      <div class="controls">
        <div class="actions" id="watchActions">
          <button type="button" class="icon-btn primary" id="playBtn" aria-label="播放筆順" title="播放筆順">
            <svg aria-hidden="true"><use href="#i-play"></use></svg>
          </button>
          <button type="button" class="icon-btn" id="stepBtn" aria-label="一筆一筆看" title="一筆一筆看">
            <svg aria-hidden="true"><use href="#i-step"></use></svg><span class="badge" id="stepCount"></span>
          </button>
        </div>
        <div class="actions" id="quizActions" hidden>
          <button type="button" class="icon-btn" id="restartBtn" aria-label="重寫" title="重寫">
            <svg aria-hidden="true"><use href="#i-replay"></use></svg>
          </button>
          <button type="button" class="icon-btn" id="demoBtn" aria-label="看示範" title="看示範">
            <svg aria-hidden="true"><use href="#i-eye"></use></svg>
          </button>
          <button type="button" class="icon-btn toggle" id="keepBtn" aria-pressed="false" aria-label="保留我的筆跡" title="保留我的筆跡">
            <svg aria-hidden="true"><use href="#i-brush"></use></svg>
          </button>
        </div>
        <div class="actions result-row" id="result" hidden>
          <span class="marks" id="resultMarks"></span>
          <span class="reward" id="resultReward"></span>
          <button type="button" class="icon-btn toggle" id="compareBtn" aria-pressed="false" aria-label="對照標準字" title="對照標準字" hidden>
            <svg aria-hidden="true"><use href="#i-compare"></use></svg>
          </button>
          <button type="button" class="icon-btn" id="againBtn" aria-label="再寫一次" title="再寫一次">
            <svg aria-hidden="true"><use href="#i-replay"></use></svg>
          </button>
          <button type="button" class="icon-btn primary" id="nextBtn" aria-label="下一個字" title="下一個字">
            <svg aria-hidden="true"><use href="#i-next"></use></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- 自己出題 -->
<div class="sheet" id="customSheet" hidden role="dialog" aria-modal="true" aria-labelledby="customTitle">
  <form class="sheet-panel card" id="customForm" autocomplete="off">
    <div class="sheet-head">
      <h2 id="customTitle">自己出題</h2>
      <button type="button" data-close>關閉</button>
    </div>
    <div class="field">
      <label for="customInput">想練習的字（最多 12 個）</label>
      <input id="customInput" maxlength="12" placeholder="例如：劉岱恬">
    </div>
    <div class="row">
      <button type="submit" class="primary">上擂台</button>
      <button type="button" id="useNameBtn">用我的名字</button>
      <button type="button" id="saveNameBtn">設為我的名字</button>
    </div>
    <div>
      <h3>最近練過</h3>
      <div class="recent" id="recentList"></div>
    </div>
  </form>
</div>

<!-- 俠客帳號 -->
<div class="sheet" id="profileSheet" hidden role="dialog" aria-modal="true" aria-labelledby="profileTitle">
  <form class="sheet-panel card" id="profileForm" autocomplete="off">
    <div class="sheet-head">
      <h2 id="profileTitle">俠客帳號</h2>
      <button type="button" data-close>關閉</button>
    </div>
    <p class="status-line" id="profileStatus"></p>
    <div class="row">
      <div class="field">
        <label for="aliasInput">江湖名字</label>
        <input id="aliasInput" maxlength="24" placeholder="例如：小恬">
      </div>
      <div class="field">
        <label for="passInput">4 位數密碼</label>
        <input id="passInput" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••">
      </div>
    </div>
    <div class="row">
      <button type="submit" class="primary">登入／建立</button>
      <button type="button" id="logoutBtn">換回訪客</button>
    </div>
    <p class="note" id="profileNote"></p>
  </form>
</div>

<!-- 設定 -->
<div class="sheet" id="settingsSheet" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet-panel card">
    <div class="sheet-head">
      <h2 id="settingsTitle">設定</h2>
      <button type="button" data-close>關閉</button>
    </div>
    <div class="opt-row" data-opt="keep">
      <span class="label">筆跡</span>
      <button type="button" data-val="0">換成標準字</button>
      <button type="button" data-val="1">保留我寫的</button>
    </div>
    <div class="opt-row" data-opt="sound">
      <span class="label">聲音</span>
      <button type="button" data-val="1">開</button>
      <button type="button" data-val="0">關</button>
    </div>
    <div class="opt-row" data-opt="radical">
      <span class="label">部首上色</span>
      <button type="button" data-val="1">開</button>
      <button type="button" data-val="0">關</button>
    </div>
    <div class="opt-row" data-opt="grid">
      <span class="label">格子</span>
      <button type="button" data-val="tian">田字格</button>
      <button type="button" data-val="mi">米字格</button>
    </div>
    <div class="opt-row" data-opt="lenient">
      <span class="label">判定</span>
      <button type="button" data-val="1">寬鬆（小朋友）</button>
      <button type="button" data-val="0">標準</button>
    </div>
    <div class="opt-row" data-opt="slow">
      <span class="label">播放速度</span>
      <button type="button" data-val="1">慢</button>
      <button type="button" data-val="0">正常</button>
    </div>
    <p class="note">像 App 一樣全螢幕使用：在 iPad / iPhone 的 Safari 點「分享」→「加入主畫面」，之後從主畫面的圖示打開。</p>
    <p class="credits">
      筆順資料來自 <a href="https://github.com/skishore/makemeahanzi" target="_blank" rel="noopener">Make Me a Hanzi</a>（Arphic Public License），以
      <a href="https://hanziwriter.org" target="_blank" rel="noopener">Hanzi Writer</a> 呈現；少數字的筆順可能和台灣教育部標準不同。注音由拼音轉換，破音字以第一個讀音為主。
    </p>
  </div>
</div>

<!-- 兵器譜 -->
<div class="sheet" id="armory" hidden role="dialog" aria-modal="true" aria-labelledby="armoryTitle">
  <div class="sheet-panel card wide">
    <div class="sheet-head">
      <h2 id="armoryTitle">兵器譜</h2>
      <button type="button" data-close>關閉</button>
    </div>
    <section>
      <div class="rank-row">
        <span class="rank-tag" id="armoryRank"></span>
        <span class="quiet" id="armoryNext"></span>
      </div>
      <div class="bar"><i id="rankBar" style="width:0%"></i></div>
      <div class="ladder" id="ladder"></div>
    </section>
    <section>
      <h3>武功</h3>
      <div class="rank-row">
        <span class="rank-tag" id="armoryKungfu"></span>
        <span class="quiet" id="armoryKungfuNext"></span>
      </div>
      <div class="kungfu-ladder" id="kungfuLadder"></div>
    </section>
    <section>
      <h3>兵器</h3>
      <div class="weapons" id="weapons"></div>
    </section>
    <section>
      <h3>字訣</h3>
      <div class="scrolls" id="scrolls"></div>
    </section>
    <section class="how">
      <span><svg class="sycee silver" aria-hidden="true"><use href="#sycee"></use></svg>寫完一個字</span>
      <span><svg class="sycee gold" aria-hidden="true"><use href="#sycee"></use></svg>自己寫全對</span>
      <span><span class="scroll-item">訣</span>自己寫三個圈 → 武功升級</span>
    </section>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="banner" id="banner" hidden>
  <div class="banner-name" id="bannerName"></div>
  <div class="banner-sub">練成了！</div>
</div>
<canvas id="sky" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<script src="js/config.js"></script>
<script src="js/pixel.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
