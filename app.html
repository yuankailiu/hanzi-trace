<title>筆順描字本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen practice notebook — name chips on top, a red 田字格 on rice paper in the middle, controls underneath (side panel on wide screens) */
:root {
  --bg: #EDF2F0;
  --paper: #FFFFFF;
  --ink: #1E2622;
  --ink-wet: #4A5752;
  --ink-halo: rgba(30, 38, 34, 0.32);
  --muted: #5B6863;
  --line: #D3DCD8;
  --frame: #C8463F;
  --grid: #E7A29B;
  --outline: #DCE3E0;
  --accent: #1B7F5F;
  --accent-soft: #D7EEE5;
  --accent-ink: #FFFFFF;
  --hint: #F0A202;
  --qi: #E3A21A;
  --radical: #2B5C9E;
  --seal: #B8322A;
  --seal-ink: #FFF4EC;
  --seal-blend: multiply;
  --star: #F2B705;
  --star-off: #D3DCD8;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "STKaiti", "DFKai-SB", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --paper: #1A2220; --ink: #ECF2EF; --ink-wet: #B9C4C0; --ink-halo: rgba(236, 242, 239, 0.22);
    --muted: #9AA7A2; --line: #2F3A37; --frame: #B4483F; --grid: #6A3330; --outline: #2C3734;
    --accent: #3FBF8F; --accent-soft: #1D3A30; --accent-ink: #0B1411; --hint: #F5B83D; --qi: #FFD36A;
    --radical: #82AEEA; --seal: #C9443A; --seal-ink: #FFF4EC; --seal-blend: normal;
    --star: #F5C542; --star-off: #3A4643;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --paper: #1A2220; --ink: #ECF2EF; --ink-wet: #B9C4C0; --ink-halo: rgba(236, 242, 239, 0.22);
  --muted: #9AA7A2; --line: #2F3A37; --frame: #B4483F; --grid: #6A3330; --outline: #2C3734;
  --accent: #3FBF8F; --accent-soft: #1D3A30; --accent-ink: #0B1411; --hint: #F5B83D; --qi: #FFD36A;
  --radical: #82AEEA; --seal: #C9443A; --seal-ink: #FFF4EC; --seal-blend: normal;
  --star: #F5C542; --star-off: #3A4643;
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  gap: 16px;
}

/* Header */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-wrap: balance;
}
h1 small {
  display: block;
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.02em;
}
form.name {
  display: flex;
  gap: 8px;
  flex: 1 1 260px;
  max-width: 420px;
}
form.name label {
  position: absolute;
  width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
}
#nameInput {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 1.35rem;
  padding: 8px 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
}
#nameInput:focus { outline: none; border-color: var(--accent); }

button {
  font: inherit;
  cursor: pointer;
  border: 2px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 500;
  touch-action: manipulation;
}
button:hover { border-color: var(--accent); }
button:focus-visible, .chip:focus-visible, .seg button:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Name chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.chip {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-width: 76px;
  padding: 8px 12px 6px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--paper);
}
.chip .glyph {
  font-family: var(--font-display);
  font-size: 2.4rem;
  line-height: 1.1;
}
.chip .meta {
  font-size: 0.78rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  min-height: 1.2em;
}
.chip[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip.missing .glyph { color: var(--muted); text-decoration: line-through; }

/* Main */
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
@media (min-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr) 300px; }
}
.stage {
  min-width: 0;
  display: grid;
  justify-items: center;
}
.box {
  position: relative;
  width: 300px;
  height: 300px;
  max-width: 100%;
  background-color: var(--paper);
  background-size: 256px 256px;
  border-radius: 6px;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0, 0, 0, 0.35);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.box svg.grid, #writer, #fx { position: absolute; inset: 0; }
.box svg.grid { width: 100%; height: 100%; }
#fx { pointer-events: none; }
.grid .frame { fill: none; stroke: var(--frame); stroke-width: 3; }
.grid .guide { stroke: var(--grid); stroke-width: 1.5; stroke-dasharray: 6 6; }
.grid .diag { display: none; }
.box.mi .grid .diag { display: inline; }
.box .missing-msg {
  position: absolute; inset: 0;
  display: grid; place-content: center; text-align: center;
  padding: 24px; color: var(--muted);
}
.box.shake { animation: shake 0.32s ease; }
@keyframes shake {
  25% { transform: translateX(-7px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
}
.box.thump { animation: thump 0.22s ease-out; }
@keyframes thump {
  40% { transform: translateY(3px) scale(0.992); }
}

/* Ink drying: wet halo spreads into the paper, then settles */
#writer.ink { animation: inkbleed 1.6s ease-out forwards; }
@keyframes inkbleed {
  0% { filter: drop-shadow(0 0 0 var(--ink-halo)); }
  35% { filter: drop-shadow(0 0 7px var(--ink-halo)) blur(0.6px); }
  100% { filter: drop-shadow(0 0 1.5px var(--ink-halo)); }
}

/* Cinnabar seal */
.seal {
  position: absolute;
  right: 3%;
  bottom: 3%;
  width: 23%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: var(--seal);
  color: var(--seal-ink);
  border-radius: 9%;
  box-shadow: inset 0 0 0 4px var(--seal), inset 0 0 0 6px var(--seal-ink);
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1;
  mix-blend-mode: var(--seal-blend);
  opacity: 0.93;
  transform: rotate(-8deg);
  pointer-events: none;
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;
}
.seal span { writing-mode: vertical-rl; letter-spacing: 0.05em; }
.seal.stamp { animation: stamp 0.38s cubic-bezier(0.3, 1.4, 0.6, 1); }
@keyframes stamp {
  0% { transform: scale(2.4) rotate(-18deg); opacity: 0; }
  60% { transform: scale(0.92) rotate(-7deg); opacity: 0.95; }
  100% { transform: scale(1) rotate(-8deg); opacity: 0.93; }
}

@media (prefers-reduced-motion: reduce) {
  .box.shake, .box.thump, .seal.stamp, #writer.ink { animation: none; }
}

/* Side panel */
.panel {
  display: grid;
  gap: 14px;
  min-width: 0;
}
.info {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 14px;
}
.mini { width: 64px; height: 64px; flex: none; }
.mini .o { fill: var(--muted); opacity: 0.3; }
.mini .r { fill: var(--radical); }
.info-text { display: grid; gap: 4px; min-width: 0; }
.zy-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.zy {
  font-family: var(--font-display);
  font-size: 1.6rem;
  letter-spacing: 0.08em;
  line-height: 1.2;
}
.say {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  font-size: 0.85rem;
  border-radius: 999px;
}
.say svg { width: 18px; height: 18px; fill: currentColor; }
.rad-line { font-size: 0.9rem; color: var(--muted); }
.rad-line b { font-family: var(--font-display); font-size: 1.15rem; color: var(--radical); font-weight: 700; }

.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 4px;
  gap: 4px;
}
.seg button {
  border: none;
  border-radius: 10px;
  padding: 10px 6px;
  display: grid;
  gap: 0;
  line-height: 1.3;
}
.seg button span { font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"] span { color: var(--accent-ink); opacity: 0.85; }

.status {
  font-family: var(--font-display);
  font-size: 1.35rem;
  min-height: 2.2em;
  text-align: center;
  text-wrap: balance;
}
.status .count { font-variant-numeric: tabular-nums; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.result {
  display: grid;
  gap: 10px;
  justify-items: center;
  text-align: center;
  padding: 14px;
  background: var(--accent-soft);
  border-radius: 14px;
}
.result .big { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
.stars { font-size: 2rem; letter-spacing: 0.08em; line-height: 1; }
.stars .on { color: var(--star); }
.stars .off { color: var(--star-off); }
.result .actions { width: 100%; }

details.settings {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  color: var(--muted);
  font-size: 0.9rem;
}
details.settings summary { cursor: pointer; }
.opt-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.opt-row .label { min-width: 4.5em; letter-spacing: 0.04em; }
.opt-row button { padding: 6px 12px; font-size: 0.9rem; }
.opt-row button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

footer {
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.6;
  max-width: 70ch;
}
footer a { color: inherit; }

/* Whole-name celebration: a night-sky veil with the name, fireworks canvas on top.
   Deliberately fixed colors (night sky, gold, lantern red) in both themes. */
.banner {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(10, 12, 24, 0.72);
  color: #FFD36A;
  font-family: var(--font-display);
  text-align: center;
  animation: veil 4.8s ease forwards;
}
.banner-name {
  font-size: clamp(3rem, 15vw, 8rem);
  font-weight: 700;
  letter-spacing: 0.18em;
  line-height: 1.1;
  text-shadow: 0 0 18px rgba(255, 170, 40, 0.6), 0 4px 0 #8E1A12;
  animation: rise 0.8s cubic-bezier(0.2, 1.3, 0.5, 1) both;
}
.banner-sub {
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  color: #FFF1D6;
  letter-spacing: 0.3em;
  animation: rise 0.8s 0.25s cubic-bezier(0.2, 1.3, 0.5, 1) both;
}
@keyframes veil {
  0% { opacity: 0; }
  8% { opacity: 1; }
  82% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes rise {
  from { transform: translateY(24px) scale(0.8); opacity: 0; }
  to { transform: none; opacity: 1; }
}
#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 41;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .banner, .banner-name, .banner-sub { animation: none; }
}
</style>

<div class="app">
  <header>
    <h1>筆順描字本<small>看筆順 → 描字 → 自己寫</small></h1>
    <form class="name" id="nameForm" autocomplete="off">
      <label for="nameInput">要練習的字</label>
      <input id="nameInput" name="name" maxlength="12" placeholder="輸入名字" value="劉岱恬">
      <button class="primary" type="submit">開始練習</button>
    </form>
  </header>

  <nav class="chips" id="chips" aria-label="名字裡的字"></nav>

  <main>
    <div class="stage" id="stage">
      <div class="box" id="box">
        <svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line class="guide" x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"></line>
          <line class="guide" x1="0" y1="50" x2="100" y2="50" vector-effect="non-scaling-stroke"></line>
          <line class="guide diag" x1="0" y1="0" x2="100" y2="100" vector-effect="non-scaling-stroke"></line>
          <line class="guide diag" x1="100" y1="0" x2="0" y2="100" vector-effect="non-scaling-stroke"></line>
          <rect class="frame" x="0" y="0" width="100" height="100" vector-effect="non-scaling-stroke"></rect>
        </svg>
        <div id="writer"></div>
        <div class="seal" id="seal" hidden><span id="sealText">甲上</span></div>
        <canvas id="fx"></canvas>
      </div>
    </div>

    <div class="panel">
      <div class="info" id="info">
        <svg class="mini" id="mini" viewBox="0 0 1024 1024" aria-hidden="true"></svg>
        <div class="info-text">
          <div class="zy-row">
            <span class="zy" id="zy"></span>
            <button type="button" class="say" id="sayBtn" aria-label="念出這個字">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"></path></svg>念
            </button>
          </div>
          <div class="rad-line" id="radLine"></div>
        </div>
      </div>

      <div class="seg" id="modes" role="group" aria-label="練習方式">
        <button type="button" data-mode="watch" aria-pressed="true">看筆順<span>一筆一筆看</span></button>
        <button type="button" data-mode="trace" aria-pressed="false">描字<span>照灰色描</span></button>
        <button type="button" data-mode="write" aria-pressed="false">自己寫<span>不看字</span></button>
      </div>

      <div class="status" id="status" aria-live="polite">&nbsp;</div>

      <div class="actions" id="watchActions">
        <button type="button" class="primary" id="playBtn">▶ 播放筆順</button>
        <button type="button" id="stepBtn">下一筆</button>
      </div>
      <div class="actions" id="quizActions" hidden>
        <button type="button" id="restartBtn">↺ 重寫</button>
        <button type="button" id="demoBtn">看示範</button>
      </div>

      <div class="result" id="result" hidden>
        <div class="big" id="resultTitle">好棒！</div>
        <div class="stars" id="resultStars"></div>
        <div id="resultMsg"></div>
        <div class="actions">
          <button type="button" id="againBtn">再寫一次</button>
          <button type="button" class="primary" id="nextBtn">下一個字 →</button>
        </div>
      </div>

      <details class="settings">
        <summary>設定</summary>
        <div class="opt-row" data-opt="sound">
          <span class="label">聲音</span>
          <button type="button" data-val="1">開</button>
          <button type="button" data-val="0">關</button>
        </div>
        <div class="opt-row" data-opt="radical">
          <span class="label">部首上色</span>
          <button type="button" data-val="1">開</button>
          <button type="button" data-val="0">關</button>
        </div>
        <div class="opt-row" data-opt="grid">
          <span class="label">格子</span>
          <button type="button" data-val="tian">田字格</button>
          <button type="button" data-val="mi">米字格</button>
        </div>
        <div class="opt-row" data-opt="lenient">
          <span class="label">判定</span>
          <button type="button" data-val="1">寬鬆（小朋友）</button>
          <button type="button" data-val="0">標準</button>
        </div>
        <div class="opt-row" data-opt="slow">
          <span class="label">播放速度</span>
          <button type="button" data-val="1">慢</button>
          <button type="button" data-val="0">正常</button>
        </div>
      </details>
    </div>
  </main>

  <footer>
    用手指或觸控筆在格子裡照順序寫。寫錯筆畫會提示，錯兩次以上會亮出該寫的那一筆；整個名字寫完會放煙火。
    筆順資料來自 <a href="https://github.com/skishore/makemeahanzi" target="_blank" rel="noopener">Make Me a Hanzi</a>（Arphic Public License），以
    <a href="https://hanziwriter.org" target="_blank" rel="noopener">Hanzi Writer</a> 呈現；少數字的筆順可能和台灣教育部標準不同，注音由拼音轉換，破音字以第一個讀音為主。
  </footer>
</div>

<div class="banner" id="banner" hidden>
  <div class="banner-name" id="bannerName"></div>
  <div class="banner-sub">練成了！</div>
</div>
<canvas id="sky" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<script>

// ---------- stroke data (bundled in 128 chunk files) ----------
const chunkCache = new Map();
function loadChunk(i) {
  if (!chunkCache.has(i)) {
    const url = 'data/c' + String(i).padStart(3, '0') + '.json';
    const p = fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
    p.catch(function () { chunkCache.delete(i); });
    chunkCache.set(i, p);
  }
  return chunkCache.get(i);
}
function getCharData(ch) {
  const i = ch.codePointAt(0) % N_CHUNKS;
  return loadChunk(i).then(function (chunk) { return chunk[ch] || null; });
}

function token(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function reducedMotion() {

}
function writerColors() {
  return {
    strokeColor: token(state.mode === 'watch' ? '--ink' : '--ink-wet'),

  return out.slice(0, 12);
}

function setupCanvas(canvas, w, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

// Hanzi Writer's coordinate frame: x in [0, 1024], y in [-124, 900] pointing up.
function toScreen(pt, size) {
  const pad = boxPadding(size);
  const scale = (size - 2 * pad) / 1024;
  const x = pad + pt[0] * scale;
  const y = size - pad - 124 * scale - pt[1] * scale;
  return { x: x, y: y };
}

function paperTexture() {

  ctx.strokeStyle = 'rgba(128, 120, 100, 0.07)';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 700; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const a = Math.random() * Math.PI * 2;
    const len = rand(3, 14);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
      x + Math.cos(a + 0.6) * len * 0.5,
      y + Math.sin(a + 0.6) * len * 0.5,
      x + Math.cos(a) * len,
      y + Math.sin(a) * len
    );
    ctx.stroke();
  }
  return c.toDataURL();
}
function sealMask() {
  const c = document.createElement('canvas');

// ---------- sound (synthesized with Web Audio, no files) ----------
let audioCtx = null;
let noiseBuf = null;
function getAudio() {
  if (!state.sound) return null;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const samples = noiseBuf.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
['pointerdown', 'touchend', 'click'].forEach(function (ev) {
  document.addEventListener(ev, function () { getAudio(); }, { capture: true, passive: true });
});

function envelope(ac, t, peak, attack, decay) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  return g;
}
function noiseSource(ac) {
  const src = ac.createBufferSource();
  src.buffer = noiseBuf;
  return src;
}

// 唰: a band-passed noise sweep plus a faint metallic ring
function sfxSwish() {
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime;

  const src = noiseSource(ac);
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(4200, t);
  bp.frequency.exponentialRampToValueAtTime(700, t + 0.2);
  const g = envelope(ac, t, 0.45, 0.03, 0.2);
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t, Math.random() * 0.5);
  src.stop(t + 0.26);

  for (const f of [2350, 3170]) {
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const og = envelope(ac, t + 0.05, 0.035, 0.01, 0.35);
    o.connect(og).connect(ac.destination);
    o.start(t + 0.05);
    o.stop(t + 0.45);
  }
}

// 碰: a seal hitting paper on a desk
function sfxStamp() {
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime;

  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.18);
  const g = envelope(ac, t, 0.9, 0.005, 0.28);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.32);

  const src = noiseSource(ac);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 900;
  const ng = envelope(ac, t, 0.4, 0.003, 0.08);
  src.connect(lp).connect(ng).connect(ac.destination);
  src.start(t, Math.random() * 0.5);
  src.stop(t + 0.1);
}

// 木魚: a gentle wooden knock for a wrong stroke
function sfxWood() {
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(660, t);
  o.frequency.exponentialRampToValueAtTime(500, t + 0.06);
  const g = envelope(ac, t, 0.28, 0.004, 0.12);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.16);
}

// 銅鑼: inharmonic partials with a slight pitch drop after the strike
function sfxGong() {
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime;
  const master = ac.createGain();
  master.gain.value = 0.8;
  master.connect(ac.destination);

  const base = 92;
  const ratios = [1, 1.52, 2.03, 2.61, 3.15, 3.76, 4.42];
  for (let i = 0; i < ratios.length; i++) {
    const f = base * ratios[i];
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 1.012, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.6);
    const decay = 4.2 - i * 0.45;
    const g = envelope(ac, t, 0.32 / (i + 1), 0.015, decay);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + decay + 0.1);
  }

  const src = noiseSource(ac);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 2000;
  const ng = envelope(ac, t, 0.3, 0.003, 0.06);
  src.connect(lp).connect(ng).connect(master);
  src.start(t, Math.random() * 0.5);
  src.stop(t + 0.1);
}

// 鞭炮: a cluster of short high-passed noise pops
function sfxCrackle() {
  const ac = getAudio();
  if (!ac) return;
  const t = ac.currentTime;
  for (let i = 0; i < 9; i++) {
    const at = t + Math.random() * 0.45;
    const src = noiseSource(ac);
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800;
    const g = envelope(ac, at, rand(0.15, 0.4), 0.002, 0.03);
    src.connect(hp).connect(g).connect(ac.destination);
    src.start(at, Math.random() * 0.5);
    src.stop(at + 0.05);
  }
}

// ---------- box effects: 劍氣 along each correct stroke ----------
const fx = { ctx: null, size: 0, slashes: [], sparks: [], rings: [], running: false, last: 0 };

function setupFx(size) {
  fx.ctx = setupCanvas(fxCanvas, size, size);
  fx.size = size;
  fx.slashes = [];
  fx.sparks = [];
  fx.rings = [];
}

function swordQi(strokeNum) {
  if (reducedMotion() || !charData) return;
  const median = charData.medians[strokeNum];
  if (!median || median.length < 2) return;

  const pts = [];
  for (const p of median) pts.push(toScreen(p, fx.size));

  // resample the median every ~5 px so the glow travels smoothly
  const samples = [{ x: pts[0].x, y: pts[0].y, d: 0 }];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i - 1].x;
    const dy = pts[i].y - pts[i - 1].y;
    const seg = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(seg / 5));
    for (let k = 1; k <= n; k++) {
      samples.push({
        x: pts[i - 1].x + dx * k / n,
        y: pts[i - 1].y + dy * k / n,
        d: total + seg * k / n,
      });
    }
    total += seg;
  }
  const dur = Math.min(320, 140 + total * 0.6);
  fx.slashes.push({ samples: samples, length: total, start: performance.now(), dur: dur, ended: false });
  startFx();
}

function startFx() {
  if (fx.running) return;
  fx.running = true;
  fx.last = performance.now();
  requestAnimationFrame(fxFrame);
}

function fxFrame(now) {
  const dt = Math.min(48, Math.max(0, now - fx.last)) / 16.7;
  fx.last = now;
  const ctx = fx.ctx;
  const size = fx.size;
  const qi = token('--qi');
  ctx.clearRect(0, 0, size, size);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const width = size / 26;
  const keep = [];
  for (const s of fx.slashes) {
    const p = Math.min(1, Math.max(0, (now - s.start) / s.dur));
    let fade = 1;
    if (p >= 1) fade = Math.max(0, 1 - (now - s.start - s.dur) / 380);
    const head = s.length * p;
    const samples = s.samples;

    let headPt = samples[0];
    ctx.shadowColor = qi;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = qi;
    for (let i = 1; i < samples.length; i++) {
      if (samples[i].d > head) break;
      const ratio = head > 0 ? samples[i].d / head : 1;
      ctx.globalAlpha = fade * (0.12 + 0.88 * ratio * ratio);
      ctx.lineWidth = width * (0.45 + 0.55 * ratio);
      ctx.beginPath();
      ctx.moveTo(samples[i - 1].x, samples[i - 1].y);
      ctx.lineTo(samples[i].x, samples[i].y);
      ctx.stroke();
      headPt = samples[i];
    }
    ctx.shadowBlur = 0;

    // bright core at the leading edge
    ctx.globalAlpha = fade;
    ctx.fillStyle = '#FFF8E1';
    ctx.beginPath();
    ctx.arc(headPt.x, headPt.y, width * 0.45, 0, Math.PI * 2);
    ctx.fill();

    if (p < 1) {
      for (let k = 0; k < 2; k++) {
        const a = Math.random() * Math.PI * 2;
        const v = rand(0.6, 2.2) * size / 400;
        fx.sparks.push({ x: headPt.x, y: headPt.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: rand(250, 480) });
      }
    } else if (!s.ended) {
      s.ended = true;
      for (let k = 0; k < 12; k++) {
        const a = k / 12 * Math.PI * 2;
        const v = rand(1.5, 3.2) * size / 400;
        fx.sparks.push({ x: headPt.x, y: headPt.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: rand(300, 520) });
      }
      fx.rings.push({ x: headPt.x, y: headPt.y, age: 0, life: 420 });
    }
    if (fade > 0) keep.push(s);
  }
  fx.slashes = keep;

  const liveSparks = [];
  ctx.fillStyle = qi;
  for (const sp of fx.sparks) {
    sp.age += dt * 16.7;
    if (sp.age >= sp.life) continue;
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.vx *= 0.94;
    sp.vy = sp.vy * 0.94 + 0.04 * dt;
    ctx.globalAlpha = 1 - sp.age / sp.life;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, width * 0.18, 0, Math.PI * 2);
    ctx.fill();
    liveSparks.push(sp);
  }
  fx.sparks = liveSparks;

  const liveRings = [];
  ctx.strokeStyle = qi;
  for (const r of fx.rings) {
    r.age += dt * 16.7;
    if (r.age >= r.life) continue;
    const k = r.age / r.life;
    ctx.globalAlpha = 1 - k;
    ctx.lineWidth = width * 0.3 * (1 - k) + 0.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, size * 0.07 * k + 2, 0, Math.PI * 2);
    ctx.stroke();
    liveRings.push(r);
  }
  fx.rings = liveRings;
  ctx.globalAlpha = 1;

  if (fx.slashes.length || fx.sparks.length || fx.rings.length) {
    requestAnimationFrame(fxFrame);
  } else {
    ctx.clearRect(0, 0, size, size);
    fx.running = false;
  }
}

      w: rand(5, 10),
      h: rand(8, 16),
      color: PAPER_COLORS[Math.floor(Math.random() * PAPER_COLORS.length)],
    });
  }

  skyCanvas.hidden = false;
  if (!sky.running) {
    sky.running = true;
    sky.last = performance.now();
    requestAnimationFrame(skyFrame);
  }
}

function burst(x, y) {
  const unit = Math.min(sky.w, sky.h) / 700;
  const count = 64;
  const hue = BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2 + rand(-0.1, 0.1);
    const v = rand(2.2, 5) * unit;
    let color = hue;
    if (Math.random() < 0.3) color = BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
    sky.parts.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      age: 0, life: rand(1000, 1600),
      color: color, size: rand(1.6, 3) * unit + 0.6,
    });
  }
  sfxCrackle();
}

function drawLantern(ctx, x, y, s, t) {
  const glow = ctx.createRadialGradient(x, y, s * 0.2, x, y, s * 1.7);
  glow.addColorStop(0, 'rgba(255, 170, 60, 0.45)');
  glow.addColorStop(1, 'rgba(255, 170, 60, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, s * 1.7, 0, Math.PI * 2);
  ctx.fill();

  // string
  ctx.strokeStyle = 'rgba(255, 220, 160, 0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y - s * 0.62);
  ctx.lineTo(x, y - s * 1.1);
  ctx.stroke();

  // body
  const body = ctx.createLinearGradient(x - s * 0.62, 0, x + s * 0.62, 0);
  body.addColorStop(0, '#8E1510');
  body.addColorStop(0.5, '#E8392B');
  body.addColorStop(1, '#8E1510');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(x, y, s * 0.62, s * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // ribs
  ctx.strokeStyle = 'rgba(120, 15, 10, 0.55)';
  ctx.lineWidth = Math.max(1, s * 0.03);
  for (const rx of [0.36, 0.14]) {
    ctx.beginPath();
    ctx.ellipse(x, y, s * rx, s * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // gold caps
  ctx.fillStyle = '#F2B705';
  ctx.fillRect(x - s * 0.24, y - s * 0.6, s * 0.48, s * 0.13);
  ctx.fillRect(x - s * 0.24, y + s * 0.47, s * 0.48, s * 0.13);

  // tassel, swinging a little
  const swing = Math.sin(t * 0.004) * s * 0.08;
  ctx.strokeStyle = '#F2B705';
  ctx.lineWidth = Math.max(1, s * 0.04);
  for (const dx of [-0.06, 0, 0.06]) {
    ctx.beginPath();
    ctx.moveTo(x + s * dx, y + s * 0.6);
    ctx.lineTo(x + s * dx + swing, y + s * 1.1);
    ctx.stroke();
  }
}

function skyFrame(now) {
  const dt = Math.min(48, Math.max(0, now - sky.last)) / 16.7;
  sky.last = now;
  const elapsed = now - sky.start;
  const ctx = sky.ctx;
  ctx.clearRect(0, 0, sky.w, sky.h);

  for (const b of sky.bursts) {
    if (!b.done && elapsed >= b.t) {
      b.done = true;
      burst(sky.w * rand(0.15, 0.85), sky.h * rand(0.12, 0.45));
    }
  }

  let fadeOut = 1;
  if (elapsed > 4200) fadeOut = Math.max(0, 1 - (elapsed - 4200) / 700);

  // lanterns rise behind everything
  ctx.globalAlpha = fadeOut;
  for (const L of sky.lanterns) {
    L.y -= L.speed * dt;
    const x = L.x0 + Math.sin(now * 0.0012 + L.phase) * L.size * 0.5;
    drawLantern(ctx, x, L.y, L.size, now + L.phase * 1000);
  }

  // firecracker paper drifting down
  for (const p of sky.paper) {
    p.x += p.vx * dt + Math.sin(now * 0.002 + p.rot) * 0.3;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)));
    ctx.restore();
  }

  // firework sparks, additive so they glow on the night veil
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  const live = [];
  for (const q of sky.parts) {
    q.age += dt * 16.7;
    if (q.age >= q.life) continue;
    q.px = q.x;
    q.py = q.y;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vx *= 0.975;
    q.vy = q.vy * 0.975 + 0.045 * dt;
    const k = q.age / q.life;
    let twinkle = 1;
    if (k > 0.6 && Math.random() < 0.3) twinkle = 0.3;
    ctx.globalAlpha = (1 - k) * fadeOut * twinkle;
    ctx.strokeStyle = q.color;
    ctx.lineWidth = q.size;
    ctx.beginPath();
    ctx.moveTo(q.px, q.py);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
    live.push(q);
  }
  sky.parts = live;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  if (elapsed < 4900) {
    requestAnimationFrame(skyFrame);
  } else {
    ctx.clearRect(0, 0, sky.w, sky.h);
    skyCanvas.hidden = true;
    sky.running = false;
  }
}
bannerEl.addEventListener('click', function () { bannerEl.hidden = true; });

// ---------- seal + ink ----------
function hideSeal() {
  sealEl.hidden = true;
  sealEl.classList.remove('stamp');
}
function stampSeal(stars) {
  const text = SEAL_TEXT[stars];
  const span = document.getElementById('sealText');
  span.textContent = text;
  const scale = text.length === 1 ? 0.15 : 0.095;
  span.style.fontSize = Math.round(builtSize * scale) + 'px';
  sealEl.hidden = false;
  sealEl.classList.remove('stamp');
  void sealEl.offsetWidth;
  sealEl.classList.add('stamp');
  setTimeout(function () {
    sfxStamp();
    box.classList.remove('thump');
    void box.offsetWidth;
    box.classList.add('thump');
  }, reducedMotion() ? 0 : 230);
}
function inkBleed() {
  writerEl.classList.remove('ink');
  void writerEl.offsetWidth;
  writerEl.classList.add('ink');
  if (writer) writer.updateColor('strokeColor', token('--ink'), { duration: 1400 });
}

// ---------- info: zhuyin, radical ----------
function renderInfo(ch, data) {
  const zyEl = document.getElementById('zy');
  const radLine = document.getElementById('radLine');
  const mini = document.getElementById('mini');
  if (!data) {
    zyEl.textContent = ch || '';
    radLine.textContent = '';
    mini.innerHTML = '';
    return;
  }

  zyEl.textContent = data.zy && data.zy.length ? data.zy.join('　') : ch;

  const rad = data.rad || '';
  if (rad) {
    const name = RADICAL_NAMES[rad];
    radLine.innerHTML = '部首 <b></b>' + (name ? '　' + name : '');
    radLine.querySelector('b').textContent = rad;
  } else {
    radLine.textContent = '';
  }

  // the whole character in grey with the radical strokes colored
  const radSet = new Set(data.radStrokes || []);
  let paths = '<g transform="scale(1,-1) translate(0,-900)">';
  for (let i = 0; i < data.strokes.length; i++) {
    const cls = radSet.has(i) ? 'r' : 'o';
    paths += '<path class="' + cls + '" d="' + data.strokes[i] + '"></path>';
  }
  mini.innerHTML = paths + '</g>';
}

// ---------- chips ----------
function renderChips() {
  chipsEl.innerHTML = '';
  state.chars.forEach(function (ch, i) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    if (strokeCount[ch] === 0) b.classList.add('missing');
    b.setAttribute('aria-current', i === state.idx ? 'true' : 'false');

    const g = document.createElement('span');
    g.className = 'glyph';
    g.textContent = ch;

    const meta = document.createElement('span');
    meta.className = 'meta';
    if (state.mode === 'watch') {
      const n = strokeCount[ch];
      if (n === 0) meta.textContent = '沒有資料';
      else if (n) meta.textContent = n + ' 筆';
    } else {
      const best = (state.stars[ch] && state.stars[ch][state.mode]) || 0;
      meta.innerHTML = '<span class="stars" style="font-size:0.9rem">' + starHtml(best) + '</span>';
    }

    b.append(g, meta);
    b.addEventListener('click', function () {
      state.idx = i;
      if (state.sound) say(ch);
      renderChips();
      build();
    });
    chipsEl.append(b);
  });
}

// ---------- writer ----------
async function build() {
  const myToken = ++buildToken;
  const ch = currentChar();
  resultEl.hidden = true;
  hideSeal();
  writerEl.classList.remove('ink');
  if (!ch) return;

  let data = null;
  try {
    data = await getCharData(ch);
  } catch (e) {
    if (myToken !== buildToken) return;
    showMissing('筆順資料載入失敗，請檢查網路後重新整理。');
    return;
  }
  if (myToken !== buildToken) return;

  if (writer) writer.cancelQuiz();
  writer = null;
  charData = data;
  writerEl.innerHTML = '';

  const size = boxSize();
  builtSize = size;
  box.style.width = size + 'px';
  box.style.height = size + 'px';
  setupFx(size);
  renderInfo(ch, data);

  if (!data) {
    strokeCount[ch] = 0;
    renderChips();
    showMissing('「' + ch + '」目前沒有筆順資料，換一個字試試看。');
    return;
  }
  strokeCount[ch] = data.strokes.length;

  const colors = writerColors();
  writer = HanziWriter.create(writerEl, ch, {
    width: size,
    height: size,
    padding: boxPadding(size),
    showCharacter: false,
    showOutline: state.mode !== 'write',
    strokeColor: colors.strokeColor,
    outlineColor: colors.outlineColor,
    drawingColor: colors.drawingColor,
    highlightColor: colors.highlightColor,
    radicalColor: colors.radicalColor,
    drawingWidth: Math.max(6, Math.round(size / 36)),
    strokeAnimationSpeed: state.slow ? 0.6 : 1.2,
    delayBetweenStrokes: state.slow ? 600 : 250,
    charDataLoader: function (c, onLoad, onError) {
      getCharData(c).then(function (d) { d ? onLoad(d) : onError(new Error('missing')); }, onError);
    },
  });
  startMode();
}

function showMissing(msg) {
  watchActions.hidden = true;
  quizActions.hidden = true;
  setStatus('&nbsp;');
  const div = document.createElement('div');
  div.className = 'missing-msg';
  div.textContent = msg;
  writerEl.append(div);
}

function startMode() {
  const ch = currentChar();
  const total = strokeCount[ch];
  stepNum = 0;
  resultEl.hidden = true;
  watchActions.hidden = state.mode !== 'watch';
  quizActions.hidden = state.mode === 'watch';

  if (state.mode === 'watch') {
    setStatus('「' + ch + '」共 <span class="count">' + total + '</span> 筆');
    writer.animateCharacter({
      onComplete: function () {
        setStatus('看完了！換「描字」試試看');
      },
    });
    return;
  }

  const hintAfter = state.mode === 'trace' ? 2 : 3;
  if (state.mode === 'write') writer.hideOutline();
  else writer.showOutline();
  setStatus('從第 <span class="count">1</span> 筆開始寫（共 ' + total + ' 筆）');

  writer.quiz({
    leniency: state.lenient ? 1.5 : 1.0,
    showHintAfterMisses: hintAfter,
    highlightOnComplete: false,
    onCorrectStroke: function (d) {
      swordQi(d.strokeNum);
      sfxSwish();
      if (d.strokesRemaining > 0) {
        setStatus('第 <span class="count">' + (d.strokeNum + 1) + '</span> 筆 ✓　還有 ' + d.strokesRemaining + ' 筆');
      }
    },
    onMistake: function (d) {
      sfxWood();
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      if (d.mistakesOnStroke >= hintAfter) setStatus('照著發亮的那一筆寫');
      else setStatus('不是這一筆喔，再試一次');
    },
    onComplete: function (d) {
      finish(d.totalMistakes);
    },
  });
}

function finish(mistakes) {
  const myToken = buildToken;
  const ch = currentChar();
  const n = starsFor(mistakes);
  if (!state.stars[ch]) state.stars[ch] = {};
  const prev = state.stars[ch][state.mode] || 0;
  if (n > prev) state.stars[ch][state.mode] = n;
  save();
  renderChips();

  inkBleed();
  setTimeout(function () {
    if (myToken === buildToken) stampSeal(n);
  }, 450);
  setTimeout(function () {
    if (myToken === buildToken && state.sound) say(ch);
  }, 1100);

  // fireworks once every character of the name has been written in this mode
  sessionDone.add(ch);
  let allDone = true;
  for (const c of state.chars) {
    if (!sessionDone.has(c) && strokeCount[c] !== 0) allDone = false;
  }
  if (allDone && state.chars.length > 1) {
    sessionDone.clear();
    setTimeout(function () { celebrate(state.chars.join('')); }, 1300);
  }

  setStatus('&nbsp;');
  quizActions.hidden = true;
  document.getElementById('resultTitle').textContent = mistakes === 0 ? '太厲害了！' : '好棒！寫完了';
  document.getElementById('resultStars').innerHTML = starHtml(n);
  document.getElementById('resultMsg').textContent = mistakes === 0 ? '一次都沒寫錯' : '這次錯了 ' + mistakes + ' 次';

  const nextBtn = document.getElementById('nextBtn');
  if (state.idx < state.chars.length - 1) {
    nextBtn.textContent = '下一個字 →';
    nextBtn.dataset.action = 'next';
  } else if (state.mode === 'trace') {
    nextBtn.textContent = '名字描完了！換自己寫 →';
    nextBtn.dataset.action = 'to-write';
  } else {
    nextBtn.textContent = '名字寫完了！從頭再來';
    nextBtn.dataset.action = 'restart';
  }
  resultEl.hidden = false;
}

// ---------- controls ----------
function setMode(mode) {
  state.mode = mode;
  sessionDone.clear();
  document.querySelectorAll('#modes button').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false');
  });
  renderChips();
  build();
}
document.querySelectorAll('#modes button').forEach(function (b) {
  b.addEventListener('click', function () { setMode(b.dataset.mode); });
});

document.getElementById('playBtn').addEventListener('click', function () {
  if (!writer) return;
  stepNum = 0;
  startMode();
});
document.getElementById('stepBtn').addEventListener('click', function () {
  if (!writer) return;
  const total = strokeCount[currentChar()];
  if (stepNum === 0 || stepNum >= total) {
    writer.hideCharacter();
    stepNum = 0;
  }
  writer.animateStroke(stepNum);
  stepNum += 1;
  setStatus('第 <span class="count">' + stepNum + ' / ' + total + '</span> 筆');
});
document.getElementById('restartBtn').addEventListener('click', function () { build(); });
document.getElementById('demoBtn').addEventListener('click', function () { setMode('watch'); });
document.getElementById('againBtn').addEventListener('click', function () { build(); });
document.getElementById('sayBtn').addEventListener('click', function () {
  const ch = currentChar();
  if (ch) say(ch);
});
document.getElementById('nextBtn').addEventListener('click', function (e) {
  const action = e.currentTarget.dataset.action;
  if (action === 'next') {
    state.idx += 1;
    renderChips();
    build();
  } else if (action === 'to-write') {
    state.idx = 0;
    setMode('write');
  } else {
    state.idx = 0;
    renderChips();
    build();
  }
});

document.getElementById('nameForm').addEventListener('submit', function (e) {
  e.preventDefault();
  setName(nameInput.value);
});

function setName(text) {
  const chars = parseName(text);
  if (chars.length === 0) {
    setStatus('請輸入中文字');
    return;
  }
  state.name = chars.join('');
  state.chars = chars;
  state.idx = 0;
  sessionDone.clear();
  nameInput.value = state.name;
  save();
  renderChips();
  build();
  chars.forEach(function (ch) {
    getCharData(ch).then(function (d) {
      strokeCount[ch] = d ? d.strokes.length : 0;
      renderChips();
    }, function () {});
  });
}

// settings
function renderOptions() {
  box.classList.toggle('mi', state.grid === 'mi');
  document.querySelectorAll('.opt-row').forEach(function (row) {
    const opt = row.dataset.opt;
    let current;
    if (opt === 'grid') current = state.grid;
    else current = state[opt] ? '1' : '0';
    row.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.val === current ? 'true' : 'false');
    });
  });
}
document.querySelectorAll('.opt-row').forEach(function (row) {
  row.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    const opt = row.dataset.opt;
    if (opt === 'grid') {
      state.grid = b.dataset.val;
      renderOptions();
      save();
      return;
    }
    state[opt] = b.dataset.val === '1';
    renderOptions();
    save();
    if (opt === 'sound') {
      if (state.sound) sfxStamp();
      return;
    }
    build();
  });
});

// rebuild only on a real width change, so a phone's toolbar showing/hiding does not reset the writing
new ResizeObserver(function () {
  if (!state.chars.length) return;
  if (Math.abs(boxSize() - builtSize) > 24) build();
}).observe(stage);

// follow theme changes without resetting progress
function recolor() {
  if (!writer) return;
  const colors = writerColors();
  for (const key in colors) {
    if (colors[key]) writer.updateColor(key, colors[key]);
  }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

loadSaved();
renderOptions();
setName(state.name);
</script>
